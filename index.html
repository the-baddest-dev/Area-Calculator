  <body>
    <!-- 
      Write an algorithm to calculate
      a. area of a triangle
      b. area of a square
      c. area of a circle
      d. area of a Quadrilateral
      e. area of a Rhombus
      f. area of a Trapezium
      g. area of a Parallelogram
      h. the body mass index (BMI)
    -->
    <h2>Area of a triangle</h2>
    <input type="text" placeholder="Enter the height" id="triangle height">
    <input type="text" placeholder="Enter the base" id="triangle base">
    <button onclick="solve()">Solve</button>
    <div id="display"></div>

    <h2>Area of a square</h2>
    <input type="text" placeholder="Enter s value" id="side">
    <button onclick="show()">Solve</button>
    <div id="display square"></div>

    <h2>Area of a circle</h2>
    <input type="text" placeholder="Enter the radius" id="circle radius">
    <button onclick="circle()">Solve</button>
    <div id="display circle"></div>

    <script src="script.js"></script>
  </body>
